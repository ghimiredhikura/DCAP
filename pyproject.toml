[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcap-landslides"
version = "1.1.0"
description = "Dependency-shared structured pruning and spatial assessment for landslide segmentation"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Deepak Ghimire"}, {name = "Seong-heum Kim"}]
dependencies = ["torch>=2.4", "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "rasterio>=1.3", "matplotlib>=3.8", "torch-pruning==1.6.1", "psutil>=5.9", "requests>=2.31", "pyproj>=3.6", "shapely>=2.0"]

[project.urls]
Repository = "https://github.com/ghimiredhikura/DCAP"
Issues = "https://github.com/ghimiredhikura/DCAP/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
factorial = ["torchvision>=0.19"]

[project.scripts]
dcap = "dcap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
